<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pit Wall Pomodoro app icon. Original artwork: a tire that doubles as a timer dial. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- tire -->
  <circle cx="512" cy="540" r="300" fill="#0d0f13"/>
  <circle cx="512" cy="540" r="300" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="10"/>
  <!-- sidewall stripe in the four compound colours, one quarter each -->
  <g fill="none" stroke-width="34" stroke-linecap="butt" transform="rotate(-90 512 540)">
    <circle cx="512" cy="540" r="232" stroke="#ff3b30" stroke-dasharray="340 1117.7" stroke-dashoffset="-12"/>
    <circle cx="512" cy="540" r="232" stroke="#ffd60a" stroke-dasharray="340 1117.7" stroke-dashoffset="-376.4"/>
    <circle cx="512" cy="540" r="232" stroke="#f5f5f7" stroke-dasharray="340 1117.7" stroke-dashoffset="-740.8"/>
    <circle cx="512" cy="540" r="232" stroke="#2f80ff" stroke-dasharray="340 1117.7" stroke-dashoffset="-1105.2"/>
  </g>
  <!-- rim -->
  <circle cx="512" cy="540" r="168" fill="#12a5a0"/>
  <circle cx="512" cy="540" r="168" fill="none" stroke="#0c7f7b" stroke-width="12"/>
  <!-- timer hand -->
  <path d="M512 540 L512 404" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <path d="M512 540 L596 590" stroke="#ff8a3d" stroke-width="26" stroke-linecap="round"/>
  <circle cx="512" cy="540" r="30" fill="#fff"/>
  <!-- stopwatch crown -->
  <rect x="472" y="168" width="80" height="62" rx="18" fill="#ff8a3d"/>
  <rect x="432" y="140" width="160" height="44" rx="22" fill="#ff8a3d"/>
</svg>
